<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Css/style.css">
    <title>ProEx</title>
</head>

<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">
            <img src="" alt="Logo">

        </div>
        <!-- Navegação principal -->
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#Explainers">Explainers</a></li>
            <li><a href="#About">About</a></li>
        </ul>
        <button class="contact-btn">Contact</button>
        <!-- Botão Hamburguer -->
        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <!-- Menu para dispositivos móveis -->
        <ul class="nav-links mobile">
            <li><a href="#home">Home</a></li>
            <li><a href="#Explainers">Explainers</a></li>
            <li><a href="#About">About</a></li>
        </ul>
    </header>


    <!-- Home Section -->
    <section id="home" class="banner">
        <h1>PROFESSIONAL <span>EXPLAINER</span></h1>
    </section>

    <section id="Explainers" class="content-section">
        <h2>Explainers</h2>
        <p>Encontra o explicador ideal para ti!</p>

        <!-- Filtros -->
        <div class="filters">
            <input type="text" id="filter-nome" placeholder="Nome do explicador" />

            <select id="filter-nivel">
                <option value="">Todos os níveis</option>
            </select>
            
            <select id="filter-preco">
                <option value="">Todos os preços</option>
                <option value="0-10">Até 10€</option>
                <option value="10-20">10€ - 20€</option>
                <option value="20-999">Mais de 20€</option>
            </select>
            
            <select id="filter-local">
                <option value="">Todas as localidades</option>
            </select>
            
            <select id="filter-disciplinas" multiple>
            </select>
        </div>

        <!-- Cards dos explicadores -->
        <div id="explainers-container" class="recipe-container"></div>
    </section>

    <!-- Sobre Section -->
    <section id="About" class="content-section">
        <h2>About Us</h2>
        <p>hdjgfljadhgfljaehg</p>

    </section>


    <button id="back-to-top" class="back-to-top" onclick="scrollToTop()">&#8593;</button>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-logo">
                <h3>Descubra</h3>
            </div>
            <div class="footer-links">
                <a href="#home">Home</a>
                <a href="#Explainers">Explainers</a>
                <a href="#About">About</a>
            </div>
            <div class="footer-social">
                <a href="#" target="_blank"><i class="fab fa-facebook-f"></i></a>
                <a href="#" target="_blank"><i class="fab fa-twitter"></i></a>
                <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="#" target="_blank"><i class="fab fa-youtube"></i></a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2025 PROFESSIONAL EXPLAINER</p>
        </div>
    </footer>

    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script src="script.js"></script>
    <script src="controller/explainers.js"></script>
</body>


</html>
